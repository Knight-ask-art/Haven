[package]
name = "haven-tauri"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.85"
description = "栖阅 Haven Tauri 壳（IPC-TAURI-001A：library_list / favorite_set）"

[lib]
name = "haven_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = []
# Runtime-only build mode for the local film/TV acceptance fixture.  This is
# intentionally opt-in and is not enabled by custom-protocol or release
# workflows; the default candidate keeps loopback destinations blocked.
film-tv-fixture = ["haven-common/film-tv-fixture"]
# Tauri 官方模板约定：只有启用 crate 自身的 custom-protocol feature，
# tauri::generate_context! 才会使用 frontendDist 内嵌资源而不是 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri "test" feature（mock runtime）只在测试目标需要——移入 dev-dependencies，
# 避免测试桩编译进 release 产物（审查 P3）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2.10.1"
chrono = "0.4.45"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24.0", features = ["v4"] }
haven-common = { path = "../后端/crates/haven-common" }
haven-domain = { path = "../后端/crates/haven-domain" }
haven-application = { path = "../后端/crates/haven-application" }
haven-infrastructure = { path = "../后端/crates/haven-infrastructure" }
# A5 外部 Agent Broker。三项都已在依赖树里（见 Cargo.lock），只是提升为直接依赖：
# - tokio 用于本地端点 I/O 与任务调度（版本与 workspace 其它 crate 一致，锁 1.53.1）；
# - async-trait 用于 BrokerAgentApi；
# - sha2 用于由用户 SID 派生端点后缀。
async-trait = "0.1.92"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 仅 Windows：Named Pipe 的 DACL 收紧与读回断言。版本与 lockfile 中的 0.59.0 对齐，
# 不引入新的 windows-sys 大版本。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
