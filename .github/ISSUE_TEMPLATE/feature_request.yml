name: Feature request
description: 提议一个可验证、可维护的栖阅改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先搜索已有 Issue，并说明希望解决的实际问题。

        请不要粘贴密码、Cookie、Token、完整本地路径、完整远程 URL、书籍正文或原始日志。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在遇到了什么限制？哪些用户和内容类型会受影响？
      placeholder: 例如：在大量本地书籍中很难发现最近添加的内容。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望看到的行为，以及成功标准。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Haven 版本
      placeholder: 例如：0.1.0
    validations:
      required: true

  - type: dropdown
    id: runtime-mode
    attributes:
      label: 运行模式
      options:
        - 独立 custom-protocol 桌面程序
        - Browser Mock / 浏览器预览
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有包含密码、Cookie、Token、完整本地路径、完整远程 URL、书籍正文或其他个人信息。
          required: true
