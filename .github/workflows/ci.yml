name: Public CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job always runs. Only this aggregate check should be required by the
  # main ruleset; component jobs may legitimately be skipped for docs-only PRs.
  changes:
    name: Classify changed scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      tauri: ${{ steps.scope.outputs.tauri }}
      mcp: ${{ steps.scope.outputs.mcp }}
      skills: ${{ steps.scope.outputs.skills }}
      film_tv: ${{ steps.scope.outputs.film_tv }}
      fixtures: ${{ steps.scope.outputs.fixtures }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo 'frontend=true'
              echo 'backend=true'
              echo 'tauri=true'
              echo 'mcp=true'
              echo 'skills=true'
              echo 'film_tv=true'
              echo 'fixtures=true'
              echo 'full=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$(mktemp)"
          trap 'rm -f -- "$changed_paths"' EXIT
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          mapfile -d '' -t changed < "$changed_paths"
          frontend=false
          backend=false
          tauri=false
          mcp=false
          skills=false
          film_tv=false
          fixtures=false
          full=false

          for path in "${changed[@]}"; do
            lower="${path,,}"
            case "$path" in
              # `case` takes the FIRST matching arm, so the Skill-load-bearing files
              # that also live under a component scope have to be matched *before*
              # the component arms below.  Listing them on the `skills` arm further
              # down would be dead code: `mcp/haven-mcp/src/constants.ts` matches
              # `mcp/*` first and the Skill contract gate would silently be skipped.
              #
              # The frozen tool list, the capability port, and the strict provider
              # schema are the legs of the tool contract the Skill document has to
              # agree with; `constants.ts` and `bridge.ts` are read directly by the
              # contract checker as its authority, and `schemas.ts` / `tools.ts` are
              # the strict (`.strictObject`) input schemas that document drives.
              mcp/haven-mcp/src/constants.ts|mcp/haven-mcp/src/bridge.ts|mcp/haven-mcp/src/schemas.ts|mcp/haven-mcp/src/tools.ts|mcp/haven-mcp/src/errors.ts)
                mcp=true
                skills=true ;;
              # The MCP server version must equal the product version, or the packer
              # refuses to package at all.
              mcp/haven-mcp/package.json)
                mcp=true
                skills=true ;;
              前端/*|.node-version)
                frontend=true ;;
              后端/*|rust-toolchain.toml|Cargo.toml|Cargo.lock)
                backend=true ;;
              # 自动配置把"安装包里的运行时目录名"钉在三处：产物目录、Tauri 的资源映射与
              # Rust 侧的路径常量。改其中任何一处都必须重跑 `mcp-launcher` 作业里那条
              # 跨边界断言（它同时读这三个文件），因此这些路径在 `src-tauri/*` 之前匹配。
              src-tauri/src/commands/mcp_client.rs|src-tauri/tauri.conf.json|src-tauri/resources/*)
                mcp=true
                tauri=true ;;
              src-tauri/*|rust-toolchain.toml)
                tauri=true ;;
              mcp/*)
                mcp=true ;;
              # The Skill packages and their checker are consumed by both runtimes:
              # the bundled document is embedded in the binary and shipped verbatim
              # to external clients, so a Skill-only change must select this gate
              # even though it touches no component code.
              # (The product version that the packer reads lives in
              # `前端/app/package.json`, which selects `full` below and therefore
              # this gate too.)
              skills/*)
                skills=true
                backend=true ;;
              tools/skills/*)
                skills=true ;;
              # The MCP runtime packager and its tests are part of the shipped
              # launcher contract; a change there must rebuild the bundle.
              tools/mcp/*)
                mcp=true ;;
            esac

            # The Skill runtime/parser lives in several components (the domain
            # parser, the infrastructure loader that embeds the document, the
            # application service, the Tauri commands and their permissions, the SQL
            # repo, the frontend gateway).  This is a second, unordered pass rather
            # than another arm above: `case` takes the first match only, so a
            # `.../agent_skill.rs` arm placed after `后端/*` would never be reached.
            case "$lower" in
              # The native Skill's exact output shape is defined by the AI provider's
              # strict schema and read by the contract tests; changing it must rerun
              # the Skill gate even when no `agent_skill` symbol/path changes.
              *agent_skill*|*agent-skill*|*agentskill*|后端/crates/haven-infrastructure/src/ai_provider.rs)
                skills=true ;;
            esac

            # Film/TV evidence is tied to the public contract, its checker,
            # and media-specific implementation/fixture paths.
            if [[ "$lower" =~ (^|/)[^/]*(film-tv|film_tv|film|video|movie|tv)[^/]*(/|$) ]] ||
               [[ "$path" == contracts/film-tv/* ]] ||
               [[ "$path" == tools/film-tv/* ]]; then
              film_tv=true
            fi

            if [[ "$lower" =~ (^|/)(fixture|fixtures)([/._-]|$) ]]; then
              fixtures=true
            fi

            # Workflow, dependency, build, and release-policy changes can
            # affect every layer even when their path is not component code.
            case "$path" in
              .github/*|.gitignore|build.ps1|tools/release/*|contracts/ipc/*|前端/app/package.json|前端/app/package-lock.json)
                full=true ;;
            esac
          done

          if [[ "$full" == true ]]; then
            frontend=true
            backend=true
            tauri=true
            mcp=true
            skills=true
            film_tv=true
            fixtures=true
          fi

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "tauri=$tauri"
            echo "mcp=$mcp"
            echo "skills=$skills"
            echo "film_tv=$film_tv"
            echo "fixtures=$fixtures"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"

  base-checks:
    name: Public policy and repository integrity
    needs: changes
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check public snapshot and forbidden artifacts
        run: python tools/release/public-snapshot-check.py

      - name: Check curated documentation
        run: python tools/docs/check.py

      - name: Test curated documentation checker
        run: python tools/docs/check.test.py

      - name: Test public snapshot policy
        run: python tools/release/public-snapshot-check.test.py

      - name: Test release version policy
        run: python tools/release/version-check.test.py

      - name: Test Unicode changed-path classification
        run: python tools/release/changed-scope.test.py

      - name: Test desktop provenance and signed updater manifest policy
        shell: pwsh
        run: |
          python tools/release/bundle-version.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Bundle version policy regression' }
          python tools/release/desktop-assets-check.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Desktop provenance policy regression' }
          python tools/release/updater-manifest-check.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater metadata policy regression' }
          python tools/release/desktop-executable-check.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Shipped executable policy regression' }

      - name: Check committed secret markers
        shell: bash
        run: |
          set -euo pipefail
          # Keep the detector focused on credential formats rather than words
          # such as `token` used legitimately in application code/tests.
          if git grep -nI -E -- \
            '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|(^|[^[:alnum:]])(ghp|gho|ghs|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{20,}'; then
            echo "committed credential marker detected" >&2
            exit 1
          fi

      - name: Check release versions
        run: python tools/release/version-check.py --version 0.1.0

      - name: Check repository whitespace integrity
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if (${env:EVENT_NAME} -eq "pull_request") {
            git diff --check "${env:BASE_SHA}" "${env:HEAD_SHA}"
          } elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
            git diff --check "${env:BEFORE_SHA}" "${env:HEAD_SHA}"
          } else {
            git diff --check HEAD^ HEAD
          }

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Install frontend dependencies
        working-directory: 前端/app
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: 前端/app
        run: npm run lint

      - name: Frontend governance
        working-directory: 前端/app
        run: npm run governance:check

      - name: Frontend fixture contract
        if: needs.changes.outputs.fixtures == 'true'
        working-directory: 前端/app
        run: npm run fixtures:check

      - name: Frontend tests
        working-directory: 前端/app
        run: npm run test

      - name: Frontend build
        working-directory: 前端/app
        run: npm run build

  # The MCP server is a separate Node package with its own lockfile, build output
  # (dist/) and test suite; it is not covered by the frontend job. Build runs
  # before test because the stdio end-to-end cases need an existing dist/.
  mcp:
    name: MCP server checks
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mcp/haven-mcp/package-lock.json

      - name: Install MCP server dependencies
        working-directory: mcp/haven-mcp
        run: npm ci --no-audit --no-fund

      - name: MCP server build
        working-directory: mcp/haven-mcp
        run: npm run build

      - name: MCP server tests
        working-directory: mcp/haven-mcp
        run: npm test

  # The installed MCP launcher.  This job is the only place that actually builds
  # the distributable MCP runtime, so it is also the only place that can assert
  # the bundle's contents, the exact command a client config will get, and that
  # the bundled Node binary really runs at the version the manifest declares.
  #
  # It runs on Windows because the launcher contract is a Windows `.cmd` plus a
  # bundled `node.exe`.  The packager itself is platform-neutral, but the
  # "installed distribution" promise is only implemented for the installer
  # target this repository actually ships (msi / nsis); see the packager
  # docstring.  Nothing here may claim a cross-platform launcher.
  mcp-launcher:
    name: MCP runtime launcher
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mcp/haven-mcp/package-lock.json

      - name: Test the MCP runtime packager
        run: python tools/mcp/package-runtime.test.py

      # 组装到 **bundle resources** 目录：`tauri build` 只是把已经存在的目录搬进
      # MSI / NSIS，它不会替我们编译 server 或下载 Node。因此这一步必须在打包之前跑，
      # 而且产物目录就是 `src-tauri/tauri.conf.json` 里 `bundle.resources` 的映射源。
      - name: Assemble the MCP runtime into the bundle resources
        shell: pwsh
        run: pwsh tools/mcp/assemble-runtime.ps1 -Out src-tauri/resources

      - name: Verify MCP assembly preserves source inputs
        shell: pwsh
        run: |
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify MCP source state' }
          if ($changes.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw 'MCP assembly modified source inputs'
          }

      - name: Assert the bundle contents, the installer mapping and the declared command
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem -Path src-tauri/resources -Filter *.manifest.json)
          if ($manifests.Count -ne 1) { throw "产物里应当恰好有一份清单，实际 $($manifests.Count) 份" }
          $manifest = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          $bundle = "src-tauri/resources/$($manifest.layout.bundleDirectory)"

          # 声明要随包分发的每一份文件都必须真的在里面。
          foreach ($file in $manifest.files) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $file.path) -PathType Leaf)) {
              throw "清单声明了 $($file.path)，产物里却没有"
            }
          }

          # 安装包资源映射：tauri.conf.json 必须把产物目录带进 bundle，
          # 否则安装后 `<resource_dir>/haven-mcp` 不存在，自动配置写出的命令就是死路。
          $config = Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $mapped = $config.bundle.resources.'resources/haven-mcp'
          if ($mapped -ne $manifest.layout.bundleDirectory) {
            throw "bundle.resources 把它映射成 '$mapped'，而产物目录叫 '$($manifest.layout.bundleDirectory)'"
          }

          # 客户端命令必须是随包分发的**真实可执行文件** + 入口脚本：
          # 不是 `.cmd` 启动器（shell:false 创建不了脚本），不是裸 `node`（用户机器上不一定有），
          # 也不是仓库路径（那要求用户保留 checkout）。
          $placeholder = '<installed-resource-dir>'
          $command = [string]$manifest.clientConfig.command
          if (-not $command.StartsWith($placeholder)) { throw "客户端命令不是安装后的路径：$command" }
          if ($command -like '*.cmd') { throw "客户端命令不能是 .cmd 启动器：$command" }
          if ($command -notlike '*/runtime/node.exe') { throw "客户端命令不是随包分发的运行时：$command" }
          $argumentList = @($manifest.clientConfig.args)
          if ($argumentList.Count -ne 1 -or $argumentList[0] -notlike '*/dist/index.js') {
            throw "客户端参数应当只有一个 entry 脚本，实际 $argumentList"
          }
          # 占位符只允许出现在**最前面**（它就是留给栖阅替换安装根的位置），
          # 其余任何 `<...>` 都是模板残留——写进用户配置就是一条永远启动不了的命令。
          $residue = ([string]$command + " " + [string]$argumentList[0]).Replace($placeholder, "")
          if ($residue.Contains('<') -or $residue.Contains('>')) {
            throw "客户端命令/参数里残留了模板占位符：$command $argumentList"
          }
          $env_keys = $manifest.clientConfig.env.PSObject.Properties.Name | Sort-Object
          if (($env_keys -join ",") -ne "HAVEN_MCP_BRIDGE,HAVEN_MCP_ENDPOINT") {
            throw "客户端环境变量集合不对：$env_keys"
          }

          # 随包分发的 Node 必须真的能跑，且版本与声明一致。
          $runtime = Join-Path $bundle $manifest.layout.runtime
          $declared = (Get-Content -LiteralPath .node-version -Raw).Trim()
          $actual = (& $runtime --version).Trim()
          if ($actual -ne "v$declared") { throw "产物里的 Node 是 $actual，声明的是 v$declared" }

          # **安装路径含空格**时的真实往返：把产物整体复制到一段带空格的路径（模拟
          # `C:\Program Files\...`），然后用清单里那**确切**的命令与参数启动一次服务端，
          # 要求它在 stdout 上回答一次 JSON-RPC。空格路径是客户端参数引号的经典陷阱，
          # 只在无空格路径上验证等于没验证。
          $installRoot = Join-Path $env:RUNNER_TEMP "Program Files/Haven 栖阅"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Copy-Item -Recurse -Force $bundle (Join-Path $installRoot "haven-mcp")
          $installedCommand = $command.Replace($placeholder, $installRoot)
          $installedArguments = @($argumentList | ForEach-Object { $_.Replace($placeholder, $installRoot) })
          foreach ($value in @($installedCommand) + $installedArguments) {
            if (-not [System.IO.Path]::IsPathRooted($value)) { throw "安装后的路径不是绝对路径：$value" }
            if (-not (Test-Path -LiteralPath $value -PathType Leaf)) { throw "安装后找不到：$value" }
          }
          $probe = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $response = $probe | & $installedCommand @installedArguments 2>$null | Select-Object -First 1
          if ($response -notmatch '"jsonrpc"') {
            throw "含空格安装路径下，清单声明的命令没有给出 JSON-RPC 应答：$response"
          }

      - name: Upload the MCP runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-runtime-${{ github.run_id }}
          path: |
            src-tauri/resources/haven-mcp
            src-tauri/resources/*.manifest.json
          if-no-files-found: error

  # The Skill contract gate.  It is selected by anything that can change what a
  # valid Skill document is, or what the distributed package contains:
  #
  #   - the Skill packages themselves and their checker (`skills/**`, `tools/skills/**`);
  #   - the MCP tool contract the document has to agree with — the frozen tool names,
  #     the capability port, and the strict input schemas;
  #   - the MCP server version, which must equal the product version or the packer
  #     refuses to package;
  #   - the Skill runtime/parser files in any component;
  #   - the product version (via the `full` scope, since it lives in
  #     `前端/app/package.json`).
  #
  # Both runtimes must agree on "what is a valid Skill document" — the Rust loader
  # fails the application at startup on a malformed document, so CI has to reach the
  # same conclusion first.  The checker is the single entry point; the tests below it
  # pin the grammar to the runtime rather than restating the rules.
  skill-contract:
    name: Skill contract checks
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # These scripts print Chinese to stdout/stderr.  On Windows a *piped* stdout
      # defaults to the legacy ANSI code page (cp1252 on the runners), where those
      # writes raise UnicodeEncodeError and fail the job for a reason that has
      # nothing to do with the Skill contract.  UTF-8 mode makes every step in this
      # job locale-independent, not just the packer.
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check the shipped Skill contract
        run: python tools/skills/skill-contract-check.py

      - name: Test the Skill contract checker
        run: python tools/skills/skill-contract-check.test.py

      - name: Test the Skill packer
        run: python tools/skills/pack-skill.test.py

  backend:
    name: Backend Rust checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-backend-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-backend-target"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Backend format
        working-directory: 后端
        run: cargo fmt --all -- --check

      - name: Backend clippy
        working-directory: 后端
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Backend build
        working-directory: 后端
        run: cargo build --workspace --locked

      - name: Backend tests
        working-directory: 后端
        run: cargo test --workspace --locked

  tauri:
    name: Tauri checks
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-tauri-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-tauri-target"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      # The custom-protocol build embeds the frontendDist directory.  A clean
      # Tauri-only checkout does not contain the ignored frontend dist output,
      # so create it here without running the unrelated frontend test suite.
      - name: Setup Node.js for Tauri bundle
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Build frontend assets for Tauri
        working-directory: 前端/app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Tauri format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Tauri clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri custom-protocol build
        working-directory: src-tauri
        run: cargo build --locked --features custom-protocol

      - name: Tauri tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Verify the desktop embedded frontend
        working-directory: src-tauri
        run: cargo test --locked --features custom-protocol --test frontend_bundle

  tauri-unix:
    name: Tauri Unix checks
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/haven-tauri-unix-target" >> "$GITHUB_ENV"

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The Tauri crate embeds ../前端/app/dist.  A clean Tauri-only checkout does
      # not contain that ignored build output, so produce it here from the same
      # root .node-version the other jobs use.  No Linux Rust target is installed:
      # this job builds the host target only.
      - name: Setup Node.js for Tauri assets
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Build frontend assets for Tauri
        working-directory: 前端/app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      # This job deliberately includes all targets: unlike the Linux CodeQL build,
      # it compiles and runs #[cfg(test)] Unix endpoint and stale-socket coverage.
      - name: Tauri Unix format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Tauri Unix clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri Unix tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

  film-tv-evidence:
    name: Film/TV blocking evidence
    needs: changes
    if: needs.changes.outputs.film_tv == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        # Keep native build outputs and temporary files outside the Chinese
        # checkout path. Some Rust/C build scripts fail when output paths are
        # non-ASCII, which would otherwise make the Film/TV evidence job fail
        # before it can report the actual evidence result.
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-film-tv-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-film-tv-target"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: 前端/app
        run: npm ci --no-audit --no-fund

      - name: Film/TV fixture contract
        working-directory: 前端/app
        run: npm run fixtures:check

      - name: Film/TV evidence contract
        run: python tools/film-tv/evidence-check.py --layer contract

      - name: Test film/TV evidence checker
        run: python tools/film-tv/evidence-check.test.py

      - name: Run film/TV CI evidence checks
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/film-tv/evidence-check.py --layer ci --output "$env:RUNNER_TEMP/film-tv-ci-evidence.json"

      - name: Upload film/TV CI evidence summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: film-tv-ci-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/film-tv-ci-evidence.json
          if-no-files-found: error

  pr-gate:
    name: PR Gate
    needs: [changes, base-checks, frontend, mcp, mcp-launcher, skill-contract, backend, tauri, tauri-unix, film-tv-evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BASE_RESULT: ${{ needs['base-checks'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          MCP_LAUNCHER_RESULT: ${{ needs['mcp-launcher'].result }}
          SKILL_RESULT: ${{ needs['skill-contract'].result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          TAURI_RESULT: ${{ needs.tauri.result }}
          TAURI_UNIX_RESULT: ${{ needs['tauri-unix'].result }}
          FILM_TV_RESULT: ${{ needs['film-tv-evidence'].result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          MCP_REQUIRED: ${{ needs.changes.outputs.mcp }}
          SKILL_REQUIRED: ${{ needs.changes.outputs.skills }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          TAURI_REQUIRED: ${{ needs.changes.outputs.tauri }}
          FILM_TV_REQUIRED: ${{ needs.changes.outputs.film_tv }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]] || { echo "scope classification failed"; exit 1; }
          [[ "$BASE_RESULT" == success ]] || { echo "base checks failed"; exit 1; }

          require_if_selected() {
            local selected="$1" result="$2" label="$3"
            if [[ "$selected" == true ]]; then
              if [[ "$result" != success ]]; then
                echo "$label is required but finished with $result"
                return 1
              fi
              echo "$label passed (required)"
              return 0
            fi
            if [[ "$result" != skipped && "$result" != success ]]; then
              echo "$label was not selected but finished with $result"
              return 1
            fi
            echo "$label skipped (not selected; result=$result)"
          }

          require_if_selected "$FRONTEND_REQUIRED" "$FRONTEND_RESULT" frontend
          require_if_selected "$MCP_REQUIRED" "$MCP_RESULT" mcp
          require_if_selected "$MCP_REQUIRED" "$MCP_LAUNCHER_RESULT" mcp-launcher
          require_if_selected "$SKILL_REQUIRED" "$SKILL_RESULT" skill-contract
          require_if_selected "$BACKEND_REQUIRED" "$BACKEND_RESULT" backend
          require_if_selected "$TAURI_REQUIRED" "$TAURI_RESULT" tauri
          require_if_selected "$TAURI_REQUIRED" "$TAURI_UNIX_RESULT" tauri-unix
          require_if_selected "$FILM_TV_REQUIRED" "$FILM_TV_RESULT" film-tv
