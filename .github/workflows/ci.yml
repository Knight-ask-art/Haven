name: Public CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job always runs. Only this aggregate check should be required by the
  # main ruleset; component jobs may legitimately be skipped for docs-only PRs.
  changes:
    name: Classify changed scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      tauri: ${{ steps.scope.outputs.tauri }}
      mcp: ${{ steps.scope.outputs.mcp }}
      film_tv: ${{ steps.scope.outputs.film_tv }}
      fixtures: ${{ steps.scope.outputs.fixtures }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo 'frontend=true'
              echo 'backend=true'
              echo 'tauri=true'
              echo 'mcp=true'
              echo 'film_tv=true'
              echo 'fixtures=true'
              echo 'full=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          frontend=false
          backend=false
          tauri=false
          mcp=false
          film_tv=false
          fixtures=false
          full=false

          for path in "${changed[@]}"; do
            lower="${path,,}"
            case "$path" in
              前端/*|.node-version)
                frontend=true ;;
              后端/*|rust-toolchain.toml|Cargo.toml|Cargo.lock)
                backend=true ;;
              src-tauri/*|rust-toolchain.toml)
                tauri=true ;;
              mcp/*)
                mcp=true ;;
            esac

            # Film/TV evidence is tied to the public contract, its checker,
            # and media-specific implementation/fixture paths.
            if [[ "$lower" =~ (^|/)[^/]*(film-tv|film_tv|film|video|movie|tv)[^/]*(/|$) ]] ||
               [[ "$path" == contracts/film-tv/* ]] ||
               [[ "$path" == tools/film-tv/* ]]; then
              film_tv=true
            fi

            if [[ "$lower" =~ (^|/)(fixture|fixtures)([/._-]|$) ]]; then
              fixtures=true
            fi

            # Workflow, dependency, build, and release-policy changes can
            # affect every layer even when their path is not component code.
            case "$path" in
              .github/*|.gitignore|build.ps1|tools/release/*|contracts/ipc/*|前端/app/package.json|前端/app/package-lock.json)
                full=true ;;
            esac
          done

          if [[ "$full" == true ]]; then
            frontend=true
            backend=true
            tauri=true
            mcp=true
            film_tv=true
            fixtures=true
          fi

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "tauri=$tauri"
            echo "mcp=$mcp"
            echo "film_tv=$film_tv"
            echo "fixtures=$fixtures"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"

  base-checks:
    name: Public policy and repository integrity
    needs: changes
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check public snapshot and forbidden artifacts
        run: python tools/release/public-snapshot-check.py

      - name: Check curated documentation
        run: python tools/docs/check.py

      - name: Test curated documentation checker
        run: python tools/docs/check.test.py

      - name: Test public snapshot policy
        run: python tools/release/public-snapshot-check.test.py

      - name: Test release version policy
        run: python tools/release/version-check.test.py

      - name: Check committed secret markers
        shell: bash
        run: |
          set -euo pipefail
          # Keep the detector focused on credential formats rather than words
          # such as `token` used legitimately in application code/tests.
          if git grep -nI -E -- \
            '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|(^|[^[:alnum:]])(ghp|gho|ghs|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{20,}'; then
            echo "committed credential marker detected" >&2
            exit 1
          fi

      - name: Check release versions
        run: python tools/release/version-check.py --version 0.1.0-beta.1

      - name: Check repository whitespace integrity
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if (${env:EVENT_NAME} -eq "pull_request") {
            git diff --check "${env:BASE_SHA}" "${env:HEAD_SHA}"
          } elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
            git diff --check "${env:BEFORE_SHA}" "${env:HEAD_SHA}"
          } else {
            git diff --check HEAD^ HEAD
          }

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Install frontend dependencies
        working-directory: 前端/app
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: 前端/app
        run: npm run lint

      - name: Frontend governance
        working-directory: 前端/app
        run: npm run governance:check

      - name: Frontend fixture contract
        if: needs.changes.outputs.fixtures == 'true'
        working-directory: 前端/app
        run: npm run fixtures:check

      - name: Frontend tests
        working-directory: 前端/app
        run: npm run test

      - name: Frontend build
        working-directory: 前端/app
        run: npm run build

  # The MCP server is a separate Node package with its own lockfile, build output
  # (dist/) and test suite; it is not covered by the frontend job. Build runs
  # before test because the stdio end-to-end cases need an existing dist/.
  mcp:
    name: MCP server checks
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mcp/haven-mcp/package-lock.json

      - name: Install MCP server dependencies
        working-directory: mcp/haven-mcp
        run: npm ci --no-audit --no-fund

      - name: MCP server build
        working-directory: mcp/haven-mcp
        run: npm run build

      - name: MCP server tests
        working-directory: mcp/haven-mcp
        run: npm test

  backend:
    name: Backend Rust checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-backend-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-backend-target"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Backend format
        working-directory: 后端
        run: cargo fmt --all -- --check

      - name: Backend clippy
        working-directory: 后端
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Backend build
        working-directory: 后端
        run: cargo build --workspace --locked

      - name: Backend tests
        working-directory: 后端
        run: cargo test --workspace --locked

  tauri:
    name: Tauri checks
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-tauri-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-tauri-target"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      # The custom-protocol build embeds the frontendDist directory.  A clean
      # Tauri-only checkout does not contain the ignored frontend dist output,
      # so create it here without running the unrelated frontend test suite.
      - name: Setup Node.js for Tauri bundle
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Build frontend assets for Tauri
        working-directory: 前端/app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Tauri format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Tauri clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri custom-protocol build
        working-directory: src-tauri
        run: cargo build --locked --features custom-protocol

      - name: Tauri tests
        working-directory: src-tauri
        run: cargo test --locked

  tauri-unix:
    name: Tauri Unix checks
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/haven-tauri-unix-target" >> "$GITHUB_ENV"

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The Tauri crate embeds ../前端/app/dist.  A clean Tauri-only checkout does
      # not contain that ignored build output, so produce it here from the same
      # root .node-version the other jobs use.  No Linux Rust target is installed:
      # this job builds the host target only.
      - name: Setup Node.js for Tauri assets
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Build frontend assets for Tauri
        working-directory: 前端/app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      # This job deliberately includes all targets: unlike the Linux CodeQL build,
      # it compiles and runs #[cfg(test)] Unix endpoint and stale-socket coverage.
      - name: Tauri Unix format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Tauri Unix clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri Unix tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

  film-tv-evidence:
    name: Film/TV blocking evidence
    needs: changes
    if: needs.changes.outputs.film_tv == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        # Keep native build outputs and temporary files outside the Chinese
        # checkout path. Some Rust/C build scripts fail when output paths are
        # non-ASCII, which would otherwise make the Film/TV evidence job fail
        # before it can report the actual evidence result.
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-film-tv-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-film-tv-target"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: 前端/app
        run: npm ci --no-audit --no-fund

      - name: Film/TV fixture contract
        working-directory: 前端/app
        run: npm run fixtures:check

      - name: Film/TV evidence contract
        run: python tools/film-tv/evidence-check.py --layer contract

      - name: Test film/TV evidence checker
        run: python tools/film-tv/evidence-check.test.py

      - name: Run film/TV CI evidence checks
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/film-tv/evidence-check.py --layer ci --output "$env:RUNNER_TEMP/film-tv-ci-evidence.json"

      - name: Upload film/TV CI evidence summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: film-tv-ci-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/film-tv-ci-evidence.json
          if-no-files-found: error

  pr-gate:
    name: PR Gate
    needs: [changes, base-checks, frontend, mcp, backend, tauri, tauri-unix, film-tv-evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BASE_RESULT: ${{ needs['base-checks'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          TAURI_RESULT: ${{ needs.tauri.result }}
          TAURI_UNIX_RESULT: ${{ needs['tauri-unix'].result }}
          FILM_TV_RESULT: ${{ needs['film-tv-evidence'].result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          MCP_REQUIRED: ${{ needs.changes.outputs.mcp }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          TAURI_REQUIRED: ${{ needs.changes.outputs.tauri }}
          FILM_TV_REQUIRED: ${{ needs.changes.outputs.film_tv }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]] || { echo "scope classification failed"; exit 1; }
          [[ "$BASE_RESULT" == success ]] || { echo "base checks failed"; exit 1; }

          require_if_selected() {
            local selected="$1" result="$2" label="$3"
            if [[ "$selected" == true ]]; then
              if [[ "$result" != success ]]; then
                echo "$label is required but finished with $result"
                return 1
              fi
              echo "$label passed (required)"
              return 0
            fi
            if [[ "$result" != skipped && "$result" != success ]]; then
              echo "$label was not selected but finished with $result"
              return 1
            fi
            echo "$label skipped (not selected; result=$result)"
          }

          require_if_selected "$FRONTEND_REQUIRED" "$FRONTEND_RESULT" frontend
          require_if_selected "$MCP_REQUIRED" "$MCP_RESULT" mcp
          require_if_selected "$BACKEND_REQUIRED" "$BACKEND_RESULT" backend
          require_if_selected "$TAURI_REQUIRED" "$TAURI_RESULT" tauri
          require_if_selected "$TAURI_REQUIRED" "$TAURI_UNIX_RESULT" tauri-unix
          require_if_selected "$FILM_TV_REQUIRED" "$FILM_TV_RESULT" film-tv
