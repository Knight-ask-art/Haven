name: Public CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  film-tv-evidence:
    name: Film/TV local and CI evidence
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-film-tv-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-film-tv-target"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: 前端/app
        run: npm ci --no-audit --no-fund

      - name: Test film/TV evidence checker
        run: python tools/film-tv/evidence-check.test.py

      - name: Run film/TV CI evidence checks
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/film-tv/evidence-check.py --layer ci --output "$env:RUNNER_TEMP/film-tv-ci-evidence.json"

      - name: Upload film/TV CI evidence summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: film-tv-ci-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/film-tv-ci-evidence.json
          if-no-files-found: error

  build-and-check:
    name: Public build and release checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASCII Cargo target directory
        # Keep native build outputs outside the Chinese checkout path. Some
        # third-party C/assembly build scripts (notably aws-lc-sys) still fail
        # when their output path contains non-ASCII characters.
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "haven-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:RUNNER_TEMP/haven-target"
          # Keep tempfile paths stable and free of Windows 8.3 aliases. The
          # storage-location integration tests compare canonical paths.
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$temp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$temp"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: 前端/app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Check public snapshot
        run: python tools/release/public-snapshot-check.py

      - name: Check release versions
        run: python tools/release/version-check.py --version 0.1.0-beta.1

      - name: Install frontend dependencies
        working-directory: 前端/app
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: 前端/app
        run: npm run lint

      - name: Frontend governance
        working-directory: 前端/app
        run: npm run governance:check

      - name: Film/TV fixture contract
        working-directory: 前端/app
        run: npm run fixtures:check

      - name: Frontend tests
        working-directory: 前端/app
        run: npm run test

      - name: Frontend build
        working-directory: 前端/app
        run: npm run build

      - name: Backend format
        working-directory: 后端
        run: cargo fmt --all -- --check

      - name: Backend clippy
        working-directory: 后端
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Backend build
        working-directory: 后端
        run: cargo build --workspace

      - name: Backend tests
        working-directory: 后端
        run: cargo test --workspace --locked

      - name: Tauri format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Tauri clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri custom-protocol build
        working-directory: src-tauri
        run: cargo build --locked --features custom-protocol

      - name: Tauri tests
        working-directory: src-tauri
        run: cargo test --locked
