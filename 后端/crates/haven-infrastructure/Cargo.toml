[package]
name = "haven-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
fast-webp = { version = "=0.1.1", default-features = false, features = ["image"] }
fs2 = "0.4.3"
haven-application = { version = "0.1.0-beta.1", path = "../haven-application" }
haven-common = { path = "../haven-common" }
haven-domain = { path = "../haven-domain" }
reqwest = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10.9"
# 大文件全量哈希走 spawn_blocking（审查 P1-1）；与 haven-application 同版本。
tokio = { version = "1.53.1", features = ["rt", "fs", "io-util", "sync", "net", "time", "macros"] }
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"
axum = { version = "0.7", features = ["json"] }
mdns-sd = "0.13"
quick-xml = { version = "0.36", features = ["serialize"] }
rfd = "0.15"
if-addrs = "0.13"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rust_cast = "0.21.0"
unicode-normalization = "0.1.24"
zeroize = "1.9.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
keyring-core = "0.7.2"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-native-keyring-store = "0.5.1"

[dev-dependencies]
base64 = "0.22"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
uuid = { version = "1.24.0", features = ["v7"] }
