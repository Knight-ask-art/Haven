[package]
name = "haven-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
haven-common = { path = "../haven-common" }
haven-domain = { path = "../haven-domain" }
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.23"
serde_json = "1.0.151"
# tokio：ScanService + Search 并行 + Settings JSON 文件需要 rt + rt-multi-thread + sync + time + fs。
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time", "fs"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
haven-infrastructure = { path = "../haven-infrastructure" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
